# Reference deployment of mxl-fabrics-proxy as a DaemonSet with one
# configuration per node.
#
# The ConfigMap holds one entry per node, named after the node it applies to.
# An init container discovers a node address usable with the configured provider
# and writes it to a shared volume as a config snippet; the entrypoint of the
# proxy container selects this node's entry and starts the proxy with both.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mxl-fabrics-proxy-config
  labels:
    app.kubernetes.io/name: mxl-fabrics-proxy
data:
  # One entry per node. The key must match the node name exactly.
  node-a.yaml: |
    defaults:
      provider: tcp
    domains:
      mxl0:
        url: mxl:///dev/shm/mxl0
    subscriptions:
      mxl0:
        - url: mxl://node-b:2283/dev/shm/mxl0
          id: 5592a23b-0974-45bb-9388-89ea81c42537
  node-b.yaml: |
    defaults:
      provider: tcp
    domains:
      mxl0:
        url: mxl:///dev/shm/mxl0
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mxl-fabrics-proxy
  labels:
    app.kubernetes.io/name: mxl-fabrics-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mxl-fabrics-proxy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mxl-fabrics-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2283"
        prometheus.io/path: /metrics
    spec:
      # The fabric endpoint address ends up in the target info that peers
      # connect to, and peers address each other by node. Host networking makes
      # that address the node's own, and is required for the verbs and efa
      # providers. It also means port 2283 is bound on the node itself.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Workers get SIGTERM with a 5s wait delay, and the proxy deletes its
      # subscriptions on the way out.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: devshm
          # MXL domains are tmpfs directories shared with the media functions
          # running on this node.
          hostPath:
            path: /dev/shm
            type: Directory
        - name: config
          configMap:
            name: mxl-fabrics-proxy-config
        - name: generated
          # Carries the discovered node address from the init container to the
          # proxy.
          emptyDir: {}
      initContainers:
        - name: node-addr-init
          image: docker.io/jonasohland/mxl-fabrics-proxy:0.0.3
          command:
            - k8s-write-node-address-config-snippet.sh
          args:
            - $(MXL_FABRICS_PROVIDER)
            - $(MXL_FABRICS_PROXY_NODE_CONFIG)
          env:
            - name: MXL_FABRICS_PROVIDER
              value: tcp
            - name: MXL_FABRICS_PROXY_NODE_CONFIG
              value: /generated/node.yaml
          volumeMounts:
            - name: generated
              mountPath: /generated
      containers:
        - name: proxy
          image: docker.io/jonasohland/mxl-fabrics-proxy:0.0.3
          command:
            - k8s-entrypoint.sh
          args:
            - --listen
            - 0.0.0.0:2283
          env:
            - name: MXL_FABRICS_PROXY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MXL_FABRICS_PROVIDER
              value: tcp
            - name: MXL_FABRICS_PROXY_CONFIG_DIR
              value: /config
            - name: MXL_FABRICS_PROXY_NODE_CONFIG
              value: /generated/node.yaml
          ports:
            - name: http
              containerPort: 2283
              hostPort: 2283
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              # One worker process per flow per direction, each polling. Scale
              # the CPU request with the number of flows this node carries.
              cpu: 500m
              memory: 256Mi
            limits:
              # Deliberately no CPU limit: throttling a transfer loop drops
              # grains.
              memory: 1Gi
          volumeMounts:
            - name: devshm
              mountPath: /dev/shm
            - name: config
              mountPath: /config
              readOnly: true
            - name: generated
              mountPath: /generated
              readOnly: true
        - name: reloader
          image: docker.io/jonasohland/mxl-fabrics-proxy:0.0.3
          command:
            - mxl-fabrics-proxy-reloader
          args:
            # Watches only this node's entry, so an edit to another node's
            # config does not trigger a reload here.
            - --config
            - /config/$(MXL_FABRICS_PROXY_NODE_NAME).yaml
            - --server
            - 127.0.0.1:2283
          env:
            - name: MXL_FABRICS_PROXY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
