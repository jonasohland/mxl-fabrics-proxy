apiVersion: v1
kind: ConfigMap
metadata:
  name: mxl-fabrics-proxy-config
  labels:
    app.kubernetes.io/name: mxl-fabrics-proxy
data:
  # One entry per node. The key must match the node name exactly.
  node-a.yaml: |
    defaults:
      provider: tcp
    domains:
      mxl0:
        url: mxl:///dev/shm/mxl0
    subscriptions:
      mxl0:
        - url: mxl://node-b.mxl.ebu.org/dev/shm/mxl0?id=e59a5dbd-d79c-41e0-b697-82b0f68ffdae
  node-b.yaml: |
    defaults:
      provider: tcp
    domains:
      mxl0:
        url: mxl:///dev/shm/mxl0
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mxl-fabrics-proxy
  labels:
    app.kubernetes.io/name: mxl-fabrics-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mxl-fabrics-proxy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mxl-fabrics-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2283"
        prometheus.io/path: /metrics
    spec:
      nodeSelector:
        # label your nodes with RDMA hardware with this label to run the proxy there
        mxl.ebu.org/mxl-fabrics-proxy: "true"
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      volumes:
        - name: devshm
          hostPath:
            path: /dev/shm
            type: Directory
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
        - name: config
          configMap:
            name: mxl-fabrics-proxy-config
        - name: generated # contains the generated config snipped that contains the probed node addr
          emptyDir: {}
      initContainers:
        # Uses mxl-fabrics-info to find an available node address for your selected provider
        - name: node-addr-init
          image: docker.io/jonasohland/mxl-fabrics-proxy:latest
          command:
            - k8s-write-node-address-config-snippet.sh
          args:
            - $(MXL_FABRICS_PROVIDER)
            - $(MXL_FABRICS_PROXY_NODE_CONFIG)
          env:
            - name: MXL_FABRICS_PROVIDER
              value: verbs
            - name: MXL_FABRICS_PROXY_NODE_CONFIG
              value: /generated/node.yaml
          securityContext:
            privileged: true
          volumeMounts:
            - name: generated
              mountPath: /generated
            - name: infiniband
              mountPath: /dev/infiniband
      containers:
        # triggers a config reload whenever the config changes
        - name: reloader
          image: docker.io/jonasohland/mxl-fabrics-proxy:latest
          command:
            - /usr/bin/mxl-fabrics-proxy-reloader
          args:
            - --config
            - /config/$(MXL_FABRICS_PROXY_NODE_NAME).yaml
            - --server
            - 127.0.0.1:2283
          env:
            - name: MXL_FABRICS_PROXY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
        - name: proxy
          image: docker.io/jonasohland/mxl-fabrics-proxy:latest
          command:
            - k8s-entrypoint.sh
          args:
            - --listen
            - 0.0.0.0:2283
          env:
            - name: MXL_FABRICS_PROXY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MXL_FABRICS_PROVIDER
              value: verbs
            - name: MXL_FABRICS_PROXY_CONFIG_DIR
              value: /config
            - name: MXL_FABRICS_PROXY_NODE_CONFIG
              value: /generated/node.yaml
          ports:
            - name: http
              containerPort: 2283
              hostPort: 2283
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            privileged: true
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          volumeMounts:
            - name: devshm
              mountPath: /dev/shm
            - name: infiniband
              mountPath: /dev/infiniband
            - name: config
              mountPath: /config
              readOnly: true
            - name: generated
              mountPath: /generated
              readOnly: true
