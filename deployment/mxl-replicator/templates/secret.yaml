{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- /*
The shared bearer token. Both roles read it from MXL_REPLICATOR_AUTH_TOKEN.

Generated on first install and read back on upgrade — see mxl-replicator.authToken. Set
auth.existingSecret to manage it yourself, which is what you want if it comes from a real secret
store.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mxl-replicator.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mxl-replicator.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  token: {{ include "mxl-replicator.authToken" . | quote }}
{{- end }}
