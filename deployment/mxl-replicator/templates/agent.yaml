{{- if .Values.agent.enabled }}
{{- $root := . }}
{{- $base := omit .Values.agent "pools" }}

{{- /*
One agent per node.

There is no per-node ConfigMap of subscriptions and no reloader. What a node is replicating lives
in the API and is applied with `mxl-replicator apply`, so the only thing here is provisioning: node
name, areas, fabric attachments, server URL, port range. That changes when the host is built rather
than when a flow is routed, which is what keeps the agent's restart rate down to upgrades.

There is no node-address init container either. The agent execs the worker's `--interfaces` probe
and asks libfabric what this node actually has, instead of a script guessing from the environment.

`agent.pools`, when non-empty, replaces the single DaemonSet with one per pool, for a fleet whose
nodes are not alike. Each pool is merged over everything in `agent`, and their node selectors must
not overlap. Two agents claiming one node name is a real failure mode and the server rejects the
second claimant.
*/}}
{{- if and (not .Values.server.enabled) (not .Values.agent.servers) }}
{{- fail "server.enabled is false and agent.servers is empty: the agents would be pointed at a Service this release does not create. Set agent.servers to the control plane they should register with." }}
{{- end }}

{{- $pools := list (dict) }}
{{- if .Values.agent.pools }}
{{- $pools = .Values.agent.pools }}
{{- end }}

{{- range $pool := $pools }}
{{- $name := default "" (get $pool "name") }}
{{- if and $root.Values.agent.pools (not $name) }}
{{- fail "every entry in agent.pools needs a name: it becomes the DaemonSet's suffix and its ConfigMap's" }}
{{- end }}
{{- $a := mergeOverwrite (deepCopy $base) (omit $pool "name") }}
{{- $fullname := printf "%s-agent" (include "mxl-replicator.fullname" $root) }}
{{- $component := "agent" }}
{{- if $name }}
{{- $fullname = printf "%s-agent-%s" (include "mxl-replicator.fullname" $root) $name }}
{{- $component = printf "agent-%s" $name }}
{{- end }}
{{- $config := include "mxl-replicator.agentConfig" (dict "root" $root "agent" $a) }}
{{- include "mxl-replicator.checkAreaMounts" (dict "root" $root "agent" $a "pool" (default "default" $name)) }}

{{- /* EFA is an extended resource: requests and limits must be equal. */}}
{{- $req := deepCopy (dig "resources" "requests" (dict) $a) }}
{{- $lim := deepCopy (dig "resources" "limits" (dict) $a) }}
{{- if $a.efa.enabled }}
{{- $_efaReq := set $req $a.efa.resourceName $a.efa.count }}
{{- $_efaLim := set $lim $a.efa.resourceName $a.efa.count }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "mxl-replicator.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $root.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Areas and fabric attachments are lists of records, which is what does not fit on a command
  # line. `node` is absent on purpose. It comes from MXL_REPLICATOR_NODE, which is the pod's own
  # spec.nodeName.
  agent.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $fullname }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "mxl-replicator.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $root.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mxl-replicator.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  updateStrategy:
    {{- toYaml $a.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "mxl-replicator.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $a.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the DaemonSet when the areas or the fabric attachments change. Both are read once,
        # at startup: without this the ConfigMap would update and every agent would carry on with
        # the configuration it started with.
        checksum/config: {{ $config | sha256sum }}
        {{- if $root.Values.metrics.annotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $a.listenPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with $root.Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mxl-replicator.serviceAccountName" $root }}
      {{- include "mxl-replicator.imagePullSecrets" $root | nindent 6 }}
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # The fabric connection is inbound to the *destination* node on a port the agent allocates
      # from --agent-port-range, so that range has to be reachable on the host.
      hostNetwork: {{ $a.hostNetwork }}
      {{- if $a.hostNetwork }}
      dnsPolicy: {{ $a.dnsPolicy }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $a.terminationGracePeriodSeconds }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}
        - name: workdir
          # Per-worker-instance working directories: a config.json, a metrics socket, and for a
          # target a target-info.json. emptyDir on purpose, because the agent holds no state that
          # has to survive a restart, and a fresh directory per worker start keeps a leftover
          # metrics socket from being a fatal EADDRINUSE.
          emptyDir:
            medium: Memory
        {{- range $mount := $a.hostMounts }}
        - name: {{ $mount.name }}
          hostPath:
            path: {{ $mount.hostPath }}
            type: {{ default "Directory" $mount.type }}
        {{- end }}
        {{- if $a.devices.infiniband.enabled }}
        - name: infiniband
          hostPath:
            path: {{ $a.devices.infiniband.path }}
            type: {{ default "Directory" $a.devices.infiniband.type }}
        {{- end }}
        {{- with $a.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: agent
          image: {{ include "mxl-replicator.agentImage" (dict "root" $root "agent" $a) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- /*
          Only what the chart itself decides. Every other agent flag is left at the binary's
          default and reachable through `extraArgs`, so this list does not have to be kept in step
          with the binary's defaults.
          */}}
          args:
            - run
            - --agent
            - --agent-config
            - /etc/mxl-replicator/agent.yaml
            - --agent-listen
            - {{ printf "0.0.0.0:%v" $a.listenPort | quote }}
            - --agent-port-range
            - {{ $a.portRange | quote }}
            - --agent-start-rate
            - {{ $a.startRate | quote }}
            - --agent-start-burst
            - {{ $a.startBurst | quote }}
            {{- if $a.detectDefaultFabric }}
            - --agent-detect-default-fabric
            {{- end }}
            {{- with $a.workerLogLevel }}
            - --agent-worker-log-level
            - {{ . | quote }}
            {{- end }}
            {{- with $a.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # Fleet-wide unique, and the node's own name is the one identifier that already is.
            - name: MXL_REPLICATOR_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MXL_REPLICATOR_LOG_LEVEL
              value: {{ $a.logLevel | quote }}
            {{- include "mxl-replicator.authEnv" $root | nindent 12 }}
            {{- with $a.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $a.listenPort }}
              {{- if and $a.hostPort (not $a.hostNetwork) }}
              # Under hostNetwork the port is already on the host and this field is redundant.
              hostPort: {{ $a.listenPort }}
              {{- end }}
              protocol: TCP
          readinessProbe:
            # /healthz, because the agent serves no /readyz. Its HTTP surface is health and this
            # node's metrics and nothing else, so this proves the process is up and serving and
            # says nothing about whether it has registered.
            #
            # It is here rather than omitted because a DaemonSet's rolling update waits on
            # readiness to move to the next node. With no probe at all a pod counts as ready the
            # instant the container starts, which would roll the whole fleet at the speed of
            # `docker run` while every node's flows are still re-establishing.
            httpGet:
              path: /healthz
              port: {{ $a.listenPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            # /healthz stays green when a transfer is failing, deliberately. A peer being
            # unreachable is no reason to restart this agent and drop every other flow on the
            # node. Failure is made observable through status and metrics instead.
            httpGet:
              path: /healthz
              port: {{ $a.listenPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if or $req $lim }}
          resources:
            {{- with $req }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $lim }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- if $a.runAsRoot }}
            # Not decoration: a container starting as a non-root uid holds no *effective*
            # capabilities whatever `privileged` says, so CAP_IPC_LOCK would be in the bounding
            # set and do nothing, and the worker would fail to register memory. See values.yaml.
            runAsUser: 0
            {{- end }}
            privileged: {{ $a.privileged }}
            {{- with $a.capabilities }}
            capabilities:
              add:
                # Required by the RDMA providers. These gate whether the agent *advertises* an
                # attachment at all. They never go over the wire.
                {{- toYaml . | nindent 16 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/mxl-replicator
              readOnly: true
            - name: workdir
              # The binary's default --agent-work-dir. Overriding it through extraArgs means
              # moving this mount with extraVolumeMounts, or the working directories land on the
              # container filesystem instead of the tmpfs below.
              mountPath: /run/mxl-replicator
            {{- range $mount := $a.hostMounts }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
            {{- end }}
            {{- if $a.devices.infiniband.enabled }}
            - name: infiniband
              mountPath: {{ $a.devices.infiniband.path }}
            {{- end }}
            {{- with $a.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
{{- end }}
