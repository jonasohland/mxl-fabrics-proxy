{{- if .Values.serviceAccount.create }}
{{- /*
Neither role talks to the Kubernetes API, so this carries no RBAC at all. It exists so that a
cluster with a policy about default service accounts, or an operator wiring an IRSA / Workload
Identity annotation, has something to attach to.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mxl-replicator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mxl-replicator.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
