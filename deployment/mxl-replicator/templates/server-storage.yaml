{{- if and .Values.server.enabled (eq .Values.server.store.backend "sqlite") .Values.server.persistence.enabled }}
{{- $p := .Values.server.persistence }}

{{- /*
Where the sqlite store lives.

`hostPath` puts a directory on one named node and needs `persistence.node`, because the data is on
that node's disk and the server has to be scheduled back onto it every time. It creates no PV and
no PVC at all: the pod names the directory. A PV/PVC pair around a hostPath would be two more
objects saying the same thing, and the claim would outlive `helm uninstall` while the data it
points at is not cluster state anyway.

`pvc` is the other durable option, either a claim you manage or one the chart creates against a
provisioner.
*/}}

{{- if and (eq $p.type "hostPath") (not $p.node) }}
{{- fail (printf "server.persistence.type=hostPath needs server.persistence.node") }}
{{- end }}

{{- if and (eq $p.type "pvc") (not $p.pvc.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mxl-replicator.storeClaimName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mxl-replicator.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
`size` and `accessModes` are immutable once the claim exists. Changing either needs the claim
deleted and recreated.
*/}}
spec:
  accessModes:
    {{- toYaml $p.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $p.size }}
  {{- if eq $p.pvc.storageClass "-" }}
  storageClassName: ""
  {{- else if $p.pvc.storageClass }}
  storageClassName: {{ $p.pvc.storageClass }}
  {{- end }}
{{- end }}
{{- end }}
