# mxl-replicator
#
# One binary, two workloads. The control-plane `server` runs as a Deployment and a per-node `agent`
# runs as a DaemonSet. The server rolls first on an upgrade: it tolerates agents a version or more
# behind, and it refuses an agent newer than itself.
#
# This chart provisions the fleet. It does not decide what gets replicated. That is requested
# through the API with `mxl-replicator apply -f <manifest>`. What is configured here is which nodes
# participate, what filesystem authority they grant, and what they can be reached on.
#
# Most of the binary's tuning flags are not surfaced as values. The binary's own defaults apply,
# and anything else goes through `server.extraArgs` or `agent.extraArgs`. Run
# `mxl-replicator run --help` for the full list.

# -- Override the name used for the chart's objects.
nameOverride: ""
# -- Override the fully qualified name (`<release>-<chart>`) entirely.
fullnameOverride: ""

image:
  registry: docker.io
  repository: jonasohland/mxl-replicator
  # Empty means `.Chart.AppVersion`. Pin it. The manifest format and the HTTP API can change
  # between versions and there is no compatibility guarantee.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of imagePullSecrets in this namespace.
  pullSecrets: []

# The shared bearer token, and the whole of the v1 auth surface.
#
# No-auth works on a trusted network. It is on by default because the user API can saturate the
# fleet's bandwidth, and the agent API can claim to be a node and read other nodes' RDMA rkeys.
auth:
  enabled: true
  # A literal token. Left empty with `existingSecret` unset, the chart generates one on first
  # install and reads it back on upgrade, so `helm upgrade` does not rotate it out from under a
  # running fleet. `helm template` has no cluster to read and emits a fresh token every time, so do
  # not pipe `helm template` into `kubectl apply` for an existing release.
  token: ""
  # Use a Secret you manage instead. The chart then creates none.
  existingSecret: ""
  existingSecretKey: token

serviceAccount:
  create: true
  # Empty means the fullname. Both workloads share one and neither needs any RBAC.
  name: ""
  annotations: {}

# Extra labels and annotations put on every object the chart creates.
commonLabels: {}
commonAnnotations: {}

# ---------------------------------------------------------------------------------------------
# Server, the control plane.
# ---------------------------------------------------------------------------------------------
server:
  enabled: true

  # sqlite is single-node and always the leader. etcd is required for more than one replica.
  # With the sqlite backend the chart renders one replica whatever is set here, because the volume
  # has one writer and so does sqlite.
  replicas: 1

  listenPort: 2283

  store:
    # sqlite | etcd
    backend: sqlite

    etcd:
      endpoints: []
      # Credentials, if the cluster has authentication enabled. `existingSecret` is preferred and
      # must carry `username` and `password` keys.
      username: ""
      password: ""
      existingSecret: ""
      tls:
        # A Secret with any of `ca.crt`, `tls.crt`, `tls.key`. Mounted at /etc/mxl-replicator/etcd.
        existingSecret: ""

  # Where the sqlite store lives. The default is a directory on one named node, which needs no
  # storage class, no provisioner and no CSI driver. Set `persistence.node` to the node that should
  # hold it. The server pod is pinned there, because the data is on that node's disk.
  persistence:
    enabled: true

    # hostPath | pvc | emptyDir
    #
    #   hostPath   A directory on `node`, created if missing. No PV and no PVC, so nothing
    #              outlives `helm uninstall` except the directory. This is the default.
    #   pvc        A PersistentVolumeClaim. Set `pvc.existingClaim` to use one you manage, or
    #              leave it empty and the chart creates one against `pvc.storageClass`.
    #   emptyDir   Ephemeral. The request set does not survive a restart. Development only.
    type: hostPath

    # Required for `hostPath`. The value of `nodeLabel` on the node that holds the directory. With
    # the default label that is the node's name as `kubectl get nodes` prints it.
    node: ""
    nodeLabel: kubernetes.io/hostname

    # The directory on the node, for `hostPath`.
    hostPath: /var/lib/mxl-replicator

    # Where the volume is mounted in the container. The store file is `<mountPath>/store.db`.
    mountPath: /var/lib/mxl-replicator

    # For a claim the chart creates. Both are immutable once it exists. Desired state is small and
    # low-churn, and observed state is leased so it collects itself, so this is generous.
    size: 1Gi
    accessModes: [ReadWriteOnce]

    pvc:
      # A claim you manage. The chart then creates none and `storageClass` is unused.
      existingClaim: ""
      # Empty selects the cluster default. "-" opts out of dynamic provisioning.
      storageClass: ""

    # The image runs as a non-root user and a directory kubelet creates is owned by root, so a
    # short root init container takes ownership before the server starts.
    initChown: true

  # Control-plane timings. Empty takes the binary's default, shown beside each one. They are
  # surfaced because a fleet on a slow or lossy network is the case that needs them.
  #
  # The reconciler's provider order, idle policy, restart thresholds and settling window are left
  # to the binary. Use `extraArgs` to change any of them.
  heartbeatInterval: ""  # 5s
  leaseTTL: ""           # 15s
  maxLongPollWait: ""    # 30s

  logLevel: info

  # The web UI, served by the server itself at `/`, on the same port and the same origin as the
  # API. Off by default, for two independent reasons:
  #
  #   - The image has to carry it. Every image built from this repository's Dockerfile does — it
  #     builds the app in a stage of its own — but the assets are compiled into the binary, so a
  #     custom image built without them refuses to start with this flag rather than serving a blank
  #     page. That fails the rollout, which is the intended way to find out.
  #   - **The browser is given no token.** With `auth.enabled` (the default) the page loads and
  #     every API call it makes comes back 401: the UI deliberately has no login, because the same
  #     token opens the agent API, which can claim to be a node and read other nodes' RDMA rkeys.
  #     Something in front has to inject `Authorization` — see the chart README, "Web UI".
  #
  # Leave it off where a proxy already serves the app beside the API. That is the other supported
  # shape, and turning this on as well means two copies of it, one of them whichever binary is
  # oldest.
  ui:
    enabled: false

  # TLS terminated by the server itself. Terminating in a proxy in front of it works too. Leave
  # this off and point the agents at the proxy.
  tls:
    enabled: false
    # A Secret with `tls.crt` and `tls.key`.
    existingSecret: ""

  service:
    type: ClusterIP
    port: 2283
    # For type: NodePort.
    nodePort: null
    annotations: {}
    labels: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: mxl-replicator.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  terminationGracePeriodSeconds: 30

  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  # Appended verbatim to the server's argument list. Any flag the chart does not surface goes
  # here, for example `[--server-idle-teardown, 10m]`.
  extraArgs: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ---------------------------------------------------------------------------------------------
# Agent, one per node.
# ---------------------------------------------------------------------------------------------
#
# Everything here is provisioning. It changes when the host is built, not when a flow is routed.
# There is no ConfigMap of subscriptions and no reloader, because that state lives in the API.
agent:
  enabled: true

  image:
    # Empty follows `image.tag`. Set it when the agent needs a different build from the server.
    # EFA is that case: the EFA image carries a libfabric with the provider compiled in and the
    # stock image does not. The server never touches a fabric and keeps the stock image.
    tag: ""

  # Which nodes run an agent. Label them rather than running one everywhere, because an agent
  # grants this project authority over the node's filesystem.
  #
  # Helm deep-merges maps, so a key set here is added to this default rather than replacing it. A
  # DaemonSet requiring a label no node carries schedules nowhere and reports `0 desired`, which
  # reads as nothing having happened. Set this key to `null` to drop it.
  nodeSelector:
    mxl.ebu.org/mxl-replicator: "true"

  listenPort: 2284
  # Bind the metrics port on the host. Under hostNetwork the port is already on the host, so this
  # only matters when hostNetwork is off.
  hostPort: true

  # The fabric connection is inbound to the destination node on a port the agent allocates from
  # `portRange`, so that range has to be reachable on the host. hostNetwork is how it is by
  # default. Turning it off means arranging that reachability some other way.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  # Inbound to the destination node, so open it there. This matches the binary's default and is
  # kept as a value because it is the number that goes in a firewall rule.
  portRange: 24000-24999

  # Control-plane URLs. Empty means the in-cluster Service this chart creates. Set it explicitly
  # for agents outside the cluster, or list every replica of an HA deployment.
  servers: []

  # Areas: the whole of this project's authority over this node's filesystem.
  #
  # `read` grants discovering and observing domains under the directory. `write` grants creating
  # them and writing flows into them. Neither implies the other, both default false, and an area
  # granting neither is refused at startup.
  #
  # A domain inside an area is addressed fleet-wide as `<area>/<elements>`. A directory
  # `/dev/shm/mxl/ingest` under the `fast` area below is `fast/ingest`, and that is its identity
  # for life. Areas may nest, and the innermost containing one names a directory.
  #
  # Every path here must be inside one of `hostMounts` or the container cannot see it. The chart
  # checks that and refuses to render otherwise.
  areas:
    - name: media
      path: /dev/shm/mxl0
      read: true
    - name: fast
      path: /dev/shm/mxl
      read: true
      write: true

  # What this node can be reached on: `(provider, fabric, selector)` triples, where `fabric` is an
  # operator-assigned opaque label. Two nodes may pair on a provider only if they share it.
  #
  # Provider availability is not reachability. Two nodes both offering `verbs` may be on different
  # InfiniBand fabrics and two both offering `efa` may be in different VPCs, so intersecting
  # provider names would assign a session that cannot connect and fail invisibly.
  #
  # A naming selector (`address`, `interface` or `device`, at most one) says which interface is
  # meant. Narrowing selectors (`network` and `ip_version`) say which of its addresses counts, and
  # compose with a name and with each other. Exactly one probe entry must survive the conjunction.
  # Zero or several is a startup error rather than a guess.
  #
  # README.md covers which selector suits which provider, and why a name alone is often ambiguous.
  fabrics:
    - provider: verbs
      fabric: ib-fabric-a
      device: mlx5_0
      ip_version: 4

  # With no attachment configured, detect one from what libfabric reports and label it `default`.
  # Nodes pair only with others carrying the same label, so this asserts a flat network. Ignored
  # when `fabrics` is non-empty.
  detectDefaultFabric: false

  # Host directories mounted into the agent. Every area path must be inside one of these.
  hostMounts:
    - name: dev-shm
      hostPath: /dev/shm
      mountPath: /dev/shm
      type: Directory

  # RDMA character devices. Needed by `verbs` and by `efa`, since an EFA adapter presents as
  # /dev/infiniband/uverbs*.
  devices:
    infiniband:
      enabled: true
      path: /dev/infiniband
      # `Directory` refuses to start on a node with no RDMA hardware, which is the right answer on
      # a fleet that is supposed to have some. Use `DirectoryOrCreate` on a mixed cluster, or turn
      # this off entirely for a tcp/shm-only pool.
      type: Directory

  # AWS Elastic Fabric Adapter.
  #
  # EFA is requested as an extended resource advertised by the `aws-efa-k8s-device-plugin`
  # DaemonSet, which must already be installed on the cluster. This chart does not install it.
  # Requesting the resource is what attaches the adapter to the pod. Without the request the device
  # is present on the node and invisible in the container.
  #
  # Turning this on also needs three things it does not imply, because each is a claim only an
  # operator can make:
  #   - an EFA-capable image, set through `agent.image.tag`
  #   - an `efa` entry in `fabrics` with the label shared by every node in the same subnet, since
  #     EFA does not route and nodes in different subnets must not share a label
  #   - `nodeSelector` narrowed to instance types that have an adapter
  #
  # EFA registers large memory regions and pins them, which is why the container is privileged by
  # default. On a cluster where that is not acceptable, request hugepages through `resources` and
  # mount them through `extraVolumes` and `extraVolumeMounts`.
  efa:
    enabled: false
    # The extended resource the device plugin advertises. Requests and limits are set to the same
    # value, as Kubernetes requires for extended resources.
    resourceName: vpc.amazonaws.com/efa
    count: 1

  # Rate control on worker starts: how many may go into setup at once, and how fast after that.
  # Agent-local, because it describes what this host can absorb. `startRate: 0` means no limit.
  startRate: 1
  startBurst: 1

  logLevel: info
  # MXL_LOG_LEVEL for worker processes. Empty follows `logLevel`.
  workerLogLevel: ""

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # An agent restart glitches every flow on that node. One at a time keeps the blast radius to
      # one node's flows.
      maxUnavailable: 1

  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      # One worker process per flow per direction, so this scales with how many flows the node
      # replicates. Raise it on a node carrying many.
      memory: 1Gi

  # The RDMA providers need IPC_LOCK and SYS_RESOURCE, and the worker needs to mmap the domain
  # files. `privileged` is the reference posture. Dropping it and keeping the capabilities works on
  # some clusters and is worth trying, but it is not what this is tested with.
  privileged: true
  capabilities:
    - IPC_LOCK
    - SYS_RESOURCE

  # Run the agent as uid 0. Required for the RDMA providers on a stock cluster.
  #
  # The image's own user is `mxl` (uid 1000), and a container that starts as a non-root uid gets an
  # empty effective capability set whatever `privileged` says. The capabilities are in the bounding
  # set and do nothing, so CAP_IPC_LOCK is not held, RLIMIT_MEMLOCK stays at the runtime's default
  # of 8 KiB on containerd, and the worker dies at `fi_mr_reg` on the first flow it registers. A
  # 1080p v210 ring is about 60 MiB.
  #
  # What that looks like from outside is a session that establishes, restarts three times and
  # reports DEGRADED, which reads as a fabric problem rather than a uid one.
  #
  # Kubernetes has no ulimit field and no GA ambient-capability support, so raising the limit for a
  # non-root uid is a node-level containerd change. Set this false once you have made it.
  runAsRoot: true

  podAnnotations: {}
  podLabels: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 30

  # Appended verbatim to the agent's argument list. Any flag the chart does not surface goes here,
  # for example `[--agent-flow-idle-after, 5s]`.
  extraArgs: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # A fleet whose nodes are not alike, such as an EFA pool beside a verbs pool, or a rack whose
  # areas live on NVMe.
  #
  # Non-empty, this replaces the single DaemonSet with one per pool rather than adding to it. A
  # default pool left running beside these would put a second agent on the nodes they select, and
  # two agents claiming one node name both receive the same assignments, both start workers, and
  # fight over ports.
  #
  # Each entry is merged over everything above, so a pool states only what differs. Lists replace
  # rather than append, so a pool declaring `fabrics` declares all of them.
  #
  #   pools:
  #     - name: efa
  #       nodeSelector: {mxl.ebu.org/fabric: efa}
  #       image: {tag: v0.3.0-efa}
  #       efa: {enabled: true}
  #       fabrics: [{provider: efa, fabric: vpc1-subnet-a, device: rdmap0s6-rdm}]
  #     - name: verbs
  #       nodeSelector: {mxl.ebu.org/fabric: verbs}
  #       fabrics: [{provider: verbs, fabric: ib-fabric-a, device: mlx5_0}]
  #
  # `name` is required and becomes the DaemonSet's suffix. Selectors must not overlap, for the
  # reason above. The chart cannot check that and the server will reject the second claimant.
  pools: []

# ---------------------------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------------------------
metrics:
  # prometheus.io/scrape annotations on both pods, for a Prometheus that discovers by annotation.
  annotations: true
  # A prometheus-operator ServiceMonitor for the server. The agents have no Service, because
  # hostNetwork with a hostPort is how a node's metrics are reachable, so they are scraped through
  # the annotations above or through the PodMonitor below.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
