# mxl-replicator
#
# Two roles, one binary, two workloads: a control-plane `server` (Deployment) and a per-node
# `agent` (DaemonSet). The server rolls *first* — it must tolerate agents a version or more
# behind, and it refuses an agent newer than itself.
#
# Nothing here routes a flow. Replication is requested through the API with
# `mxl-replicator apply -f <manifest>`; what this chart configures is provisioning — which nodes
# participate, what filesystem authority they grant, and what they can be reached on.

# -- Override the name used for the chart's objects.
nameOverride: ""
# -- Override the fully qualified name (`<release>-<chart>`) entirely.
fullnameOverride: ""

image:
  registry: docker.io
  repository: jonasohland/mxl-replicator
  # Empty means `.Chart.AppVersion`. **Pin it.** The manifest format and the HTTP API are subject
  # to change and there is no compatibility guarantee across versions.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of imagePullSecrets in this namespace.
  pullSecrets: []

# The shared bearer token, and the whole of the v1 auth surface.
#
# No-auth is supported on a trusted network, but the user API is a fleet-wide bandwidth
# exhaustion primitive and the agent API can claim to be a node and read other nodes' RDMA
# rkeys — so it is on by default here.
auth:
  enabled: true
  # A literal token. Left empty with `existingSecret` unset, the chart generates one on first
  # install and reads it back on upgrade, so `helm upgrade` does not rotate it out from under a
  # running fleet. `helm template` has no cluster to read, so it emits a fresh token every time —
  # do not pipe `helm template` into `kubectl apply` for an existing release.
  token: ""
  # Use a Secret you manage instead. The chart then creates none.
  existingSecret: ""
  existingSecretKey: token

serviceAccount:
  create: true
  # Empty means the fullname. Both workloads share one; neither needs any RBAC.
  name: ""
  annotations: {}

# Extra labels and annotations put on every object the chart creates.
commonLabels: {}
commonAnnotations: {}

# ---------------------------------------------------------------------------------------------
# Server — the control plane.
# ---------------------------------------------------------------------------------------------
server:
  enabled: true

  # sqlite is single-node and always the leader; etcd is required for more than one replica.
  # This is clamped: with the sqlite backend the chart renders one replica whatever is set here,
  # because the PVC is ReadWriteOnce and sqlite has one writer.
  replicas: 1

  listenPort: 2283

  store:
    # sqlite | etcd
    backend: sqlite

    sqlite:
      # Must sit inside `persistence.mountPath`.
      path: /var/lib/mxl-replicator/store.db

    etcd:
      endpoints: []
      prefix: /mxl-replicator
      # Credentials, if the cluster has authentication enabled. `existingSecret` is preferred;
      # it must carry `username` and `password` keys.
      username: ""
      password: ""
      existingSecret: ""
      tls:
        # A Secret with any of `ca.crt`, `tls.crt`, `tls.key`. Mounted at /etc/mxl-replicator/etcd.
        existingSecret: ""

  # Where the sqlite store lives.
  #
  # **The default is a directory on one named node**, which is the shape asked for: no storage
  # class, no provisioner, no CSI driver. Set `persistence.node` to the node that should hold it
  # — the server pod is pinned there, and it has to be, because the data is on that node's disk.
  persistence:
    enabled: true

    # hostPath | local | existingClaim | storageClass | emptyDir
    #
    #   hostPath        A directory on `node`, created if missing. No PV, no PVC. The
    #                   least-friction option and the default.
    #   local           A pre-provisioned `local` PersistentVolume on `node`, bound to a PVC the
    #                   chart creates. The directory must already exist — the local volume plugin
    #                   will not create it — but the volume is a real cluster object with node
    #                   affinity the scheduler honours.
    #   existingClaim   A PVC you manage. `node` is then not used.
    #   storageClass    A PVC the chart creates against a provisioner.
    #   emptyDir        Ephemeral. The request set does not survive a restart. Development only.
    type: hostPath

    # **Required for `hostPath` and `local`.** The value of `nodeLabel` on the node that holds
    # the volume. With the default label that is the node's name as `kubectl get nodes` prints it.
    node: ""
    nodeLabel: kubernetes.io/hostname

    # The directory on the node, for `hostPath` and `local`.
    hostPath: /var/lib/mxl-replicator

    # Where it is mounted in the container. `store.sqlite.path` must be inside it.
    mountPath: /var/lib/mxl-replicator

    # Desired state is small and low-churn by design and observed state is leased, so it collects
    # itself. This is generous.
    size: 1Gi
    accessModes: [ReadWriteOnce]

    # type: existingClaim
    existingClaim: ""

    # type: storageClass. Empty selects the cluster default; "-" opts out of dynamic provisioning.
    storageClass: ""

    # The image runs as a non-root user and a directory kubelet creates is owned by root, so a
    # short root init container takes ownership before the server starts. hostPath volumes get no
    # fsGroup treatment from Kubernetes, which is why this exists rather than a pod securityContext.
    initChown:
      enabled: true
      # Resolved inside the image with `id -u`, so it follows the image rather than a number
      # hardcoded here.
      user: mxl

  # Control-plane timings. The defaults are the binary's own; they are surfaced because a fleet
  # on a slow or lossy network is the case that needs them.
  heartbeatInterval: 5s
  leaseTTL: 15s
  # Heartbeat intervals to wait before the first reconcile, so a restart adopts running sessions
  # rather than re-establishing them. Ends early once every leased agent has reported.
  settlingHeartbeats: 3
  maxLongPollWait: 30s

  # The order used when a request does not pin a provider. An explicit pin is honoured or the
  # request fails — it is never silently substituted — so this only decides the unpinned case.
  providerOrder: [efa, verbs, tcp, shm]

  # Session-level worker settings. They live on the server because both ends of a session must be
  # handed identical values.
  idleTimeout: 0s
  idleTeardown: 5m
  connectTimeout: 60s
  noNetworkLatencyMeasurement: false

  degradedRestarts: 3
  failedRestarts: 10

  logLevel: info

  # TLS terminated by the server itself. Terminating in a proxy in front of it is equally
  # supported — leave this off and point the agents at the proxy.
  tls:
    enabled: false
    # A Secret with `tls.crt` and `tls.key`.
    existingSecret: ""

  service:
    type: ClusterIP
    port: 2283
    # For type: NodePort.
    nodePort: null
    annotations: {}
    labels: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: mxl-replicator.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  terminationGracePeriodSeconds: 30

  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  # Appended verbatim to the server's argument list.
  extraArgs: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ---------------------------------------------------------------------------------------------
# Agent — one per node.
# ---------------------------------------------------------------------------------------------
#
# Everything under here is provisioning: it changes when the host is built, not when a flow is
# routed. There is no ConfigMap of subscriptions and no reloader — that state lives in the API.
agent:
  enabled: true

  # Which nodes run an agent. Label them, rather than running one everywhere: an agent grants
  # this project authority over the node's filesystem.
  #
  # Helm deep-merges maps, so a key you set here is *added* to this default rather than replacing
  # it — and a DaemonSet requiring a label no node carries schedules nowhere and reports
  # `0 desired`, which reads as nothing having happened. Set this key to `null` to drop it.
  nodeSelector:
    mxl.ebu.org/mxl-replicator: "true"

  listenPort: 2284
  # Expose the metrics port on the host. Redundant under hostNetwork, which is the default, and
  # kept for the case where hostNetwork is turned off.
  hostPort: true

  # The fabric connection is inbound to the *destination* node on a port the agent allocates from
  # `portRange`, so that range has to be reachable on the host. hostNetwork is how it is by
  # default; turning it off means arranging that reachability some other way.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  # Control-plane URLs. Empty means the in-cluster Service this chart creates. Set it explicitly
  # for agents outside the cluster, or list every replica of an HA deployment.
  servers: []

  # **Areas: the whole of this project's authority over this node's filesystem.**
  #
  # `read` grants discovering and observing domains under the directory; `write` grants creating
  # them and writing flows into them. Neither implies the other, both default false, and an area
  # granting neither is refused at startup.
  #
  # A domain inside an area is addressed fleet-wide as `<area>/<elements>` — so a directory
  # `/dev/shm/mxl/ingest` under the `fast` area below is `fast/ingest`, and that is its identity
  # for life. Areas may nest; the innermost containing one names a directory.
  #
  # Every path here must be inside one of `hostMounts` or the container cannot see it. The chart
  # checks that and refuses to render otherwise.
  areas:
    - name: media
      path: /dev/shm/mxl0
      read: true
    - name: fast
      path: /dev/shm/mxl
      read: true
      write: true

  # **What this node can be reached on.** `(provider, fabric, selector)` triples, where `fabric`
  # is an operator-assigned opaque label: two nodes may pair on a provider only if they share it.
  #
  # Provider availability is not reachability. Two nodes both offering `verbs` may be on different
  # InfiniBand fabrics and two both offering `efa` may be in different VPCs, so intersecting
  # provider *names* would assign a session that cannot connect and fail invisibly.
  #
  # Selectors come in two kinds. A **naming** selector — `address`, `interface` or `device`, at
  # most one — says which interface is meant. **Narrowing** selectors — `network` and
  # `ip_version` — say which of its addresses counts, and compose with a name and with each other.
  # Exactly one probe entry must survive the conjunction; zero or several is a loud startup error
  # rather than a guess.
  #
  # For verbs, `device` is the libfabric device name — `mlx5_0` for the first port of a Mellanox
  # HCA, which is what `ls /sys/class/infiniband` on the node prints — and *not* a netdev name.
  # `interface` is the netdev (`ib0`, or the RoCE port's `ensXnpY`), resolved through the addresses
  # the kernel reports for it.
  #
  # **A name alone is often ambiguous.** An HCA with both an IPv4 address and a link-local IPv6
  # one reports two probe entries under the same device, and the agent says so at startup:
  #
  #   dropping a configured fabric attachment  reason="device: mlx5_0 matches 2 verbs interfaces"
  #
  # That is what the narrowing selectors are for, and why they matter *here* in particular: every
  # value in this list is fleet-wide. `address:` is exact and always unique, but it costs a
  # `pools:` entry or a per-node overlay to state something ("we are on v4") that is true of the
  # whole fleet — where `device` plus `ip_version` says it once:
  #
  #   fabrics:
  #     - provider: verbs
  #       fabric: ib-fabric-a
  #       device: mlx5_0
  #       ip_version: 4
  #
  # `network` goes one further and names no hardware at all: it picks each node's own address
  # inside a CIDR prefix, which is the same value on every node even where the netdev is `eth1`
  # here and `ens5f0` there. It is usually the right selector for tcp.
  #
  #   fabrics:
  #     - provider: tcp
  #       fabric: dc1-data
  #       network: 10.1.0.0/16
  #
  # Neither narrowing selector says anything about reachability, and neither can: two nodes inside
  # one prefix may still have no route between them. Deciding that is what the `fabric` label is.
  fabrics:
    - provider: verbs
      fabric: ib-fabric-a
      device: mlx5_0
      ip_version: 4

  # With no attachment configured, detect one from what libfabric reports and label it `default`.
  # Nodes pair only with others carrying the same label, so this asserts a flat network. Ignored
  # when `fabrics` is non-empty.
  detectDefaultFabric: false

  # Host directories mounted into the agent. Every area path must be inside one of these.
  hostMounts:
    - name: dev-shm
      hostPath: /dev/shm
      mountPath: /dev/shm
      type: Directory

  # RDMA character devices. Needed by `verbs` and by `efa` — an EFA adapter presents as
  # /dev/infiniband/uverbs*.
  devices:
    infiniband:
      enabled: true
      path: /dev/infiniband
      # `Directory` refuses to start on a node with no RDMA hardware, which is the right answer
      # on a fleet that is supposed to have some. Set `DirectoryOrCreate` on a mixed cluster, or
      # turn this off entirely for a tcp/shm-only pool.
      type: Directory

  # AWS Elastic Fabric Adapter.
  #
  # EFA is requested as an extended resource, advertised by the `aws-efa-k8s-device-plugin`
  # DaemonSet, which must already be installed on the cluster — this chart does not install it.
  # Requesting it is what attaches the adapter to the pod; without the request the device is
  # present on the node and invisible in the container.
  #
  # Turning this on also needs three things that are *not* implied by it, because each is a claim
  # only an operator can make:
  #   - an EFA-capable image (`efa.image.tag`, default `latest-efa`), built on the EFA-enabled
  #     libfabric base;
  #   - an `efa` entry in `fabrics` with the label shared by every node in the same subnet —
  #     EFA does not route, so nodes in different subnets must not share a label;
  #   - `nodeSelector` narrowed to instance types that have an adapter.
  efa:
    enabled: false
    # The extended resource the device plugin advertises. Requests and limits are set to the same
    # value, as Kubernetes requires for extended resources.
    resourceName: vpc.amazonaws.com/efa
    count: 1
    # Empty means `<image.tag>-efa`. Set to a full tag to pin one, or to "-" to keep the tag
    # `image.tag` already names.
    image:
      tag: ""
    # EFA registers large memory regions and pins them. Anything but "unlimited" here will show up
    # as workers failing to register memory rather than as a configuration error, so the chart
    # leaves the container privileged by default and this is here for the case where it is not.
    hugepages:
      enabled: false
      size: 2Mi
      amount: 512Mi

  workDir: /run/mxl-replicator
  # Inbound to the destination node, so open it there.
  portRange: 24000-24999

  # Rate control on worker *starts*: how many may go into setup at once, and how fast after that.
  # Agent-local, because it describes what this host can absorb. `startRate: 0` means no limit.
  startRate: 0.5
  startBurst: 2

  # Report a flow as no longer producing after its head index has stood still this long.
  flowIdleAfter: 3s

  logLevel: info
  # MXL_LOG_LEVEL for worker processes. Empty follows `logLevel`.
  workerLogLevel: ""

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # An agent restart glitches every flow on that node. One at a time keeps the blast radius
      # to one node's flows.
      maxUnavailable: 1

  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      # One worker process per flow per direction, so this scales with how many flows the node
      # replicates. Raise it on a node carrying many.
      memory: 1Gi

  # The RDMA providers need IPC_LOCK and SYS_RESOURCE, and the worker needs to mmap the domain
  # files. `privileged` is the reference posture; dropping it and keeping the capabilities works
  # on some clusters and is worth trying, but it is not what this is tested with.
  privileged: true
  capabilities:
    - IPC_LOCK
    - SYS_RESOURCE

  # Run the agent as uid 0.
  #
  # **Required for the RDMA providers, and not really optional.** The image's own user is `mxl`
  # (uid 1000), and a container that starts as a non-root uid gets an *empty effective capability
  # set* whatever `privileged` says — the caps are in the bounding set and do nothing. So
  # CAP_IPC_LOCK is not held, RLIMIT_MEMLOCK stays at the runtime's default (8 KiB on containerd),
  # and the worker dies at `fi_mr_reg` with "Failed to register memory region: Cannot allocate
  # memory" on the first flow it tries to register — a 1080p v210 ring is ~60 MiB.
  #
  # It presents as a session that establishes, restarts three times and reports DEGRADED, which
  # reads as a fabric problem rather than a uid one.
  #
  # Kubernetes has no ulimit field and no GA ambient-capability support, so raising the limit for
  # a non-root uid is a node-level containerd change rather than something a chart can express.
  # Set this false only once you have made it.
  runAsRoot: true

  podAnnotations: {}
  podLabels: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 30

  extraArgs: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # A fleet whose nodes are not alike — an EFA pool beside a verbs pool, or a rack whose areas
  # live on NVMe.
  #
  # **Non-empty, this replaces the single DaemonSet with one per pool**, rather than adding to it:
  # a default pool left running beside these would put a second agent on the nodes they select,
  # and two agents claiming one node name is a real failure mode — both receive the same
  # assignments, both start workers, and they fight over ports.
  #
  # Each entry is merged over everything above, so a pool states only what differs. Lists replace
  # rather than append: a pool declaring `fabrics` declares all of them.
  #
  #   pools:
  #     - name: efa
  #       nodeSelector: {mxl.ebu.org/fabric: efa}
  #       efa: {enabled: true}
  #       fabrics: [{provider: efa, fabric: vpc1-subnet-a, device: rdmap0s6-rdm}]
  #     - name: verbs
  #       nodeSelector: {mxl.ebu.org/fabric: verbs}
  #       fabrics: [{provider: verbs, fabric: ib-fabric-a, device: mlx5_0}]
  #
  # `name` is required and becomes the DaemonSet's suffix. Selectors must not overlap, for the
  # reason above; the chart cannot check that and the server will reject the second claimant.
  pools: []

# ---------------------------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------------------------
metrics:
  # prometheus.io/scrape annotations on both pods, for a Prometheus that discovers by annotation.
  annotations: true
  # A prometheus-operator ServiceMonitor for the server. The agents are scraped through the
  # annotations above or through a PodMonitor; they have no Service, deliberately — hostNetwork
  # with a hostPort is how a node's metrics are reachable.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
